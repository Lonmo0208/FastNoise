plugins {
    id 'fabric-loom' version "${loom_version}"
}

loom {
    accessWidenerPath = project(':').file('src/main/resources/zfastnoise.ct')

    runs {
        server {
            server()
            if (project.hasProperty("zperfbenchmark")) {
                property('zperfbenchmark', project.getProperty('zperfbenchmark'))
            }
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation project(path: ':', configuration: 'namedElements')
    implementation 'org.openjdk.jmh:jmh-core:1.37'
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property 'loader_version', project.loader_version
    inputs.property 'minecraft_version', project.min_minecraft_version

    filesMatching('fabric.mod.json') {
        expand(inputs.properties)
    }
}
